name: CD - Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id }}
  cancel-in-progress: true

jobs:
  build-and-publish-stable:
    name: Lint, Test, Build & Publish Stable
    if: github.event.release.target_commitish == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Volta (Node + pnpm)
        uses: volta-cli/action@v5
        with:
          package-json-path: ./package.json

      - name: Install Node.js
        run: volta install node

      - name: Install pnpm
        run: volta install pnpm

      - name: Extract and validate release version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Release tag: $TAG"
          if [[ "$TAG" =~ ^v[0-9] ]]; then
            VERSION="${TAG#v}"
          else
            echo "::error ::Tag must start with 'v' followed by version number (e.g., v1.2.3)"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Invalid release version format. Expected X.Y.Z (e.g., 1.2.3), got: $VERSION"
            exit 1
          fi
          echo "Using release version: $VERSION"
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @cocoar/playground exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Stamp package versions
        run: |
          echo "Setting package versions to: $RELEASE_VERSION"

          shopt -s nullglob
          for pkg in packages/*/package.json; do
            if [ -f "$pkg" ] && [ "$(jq -r '.private // false' "$pkg")" != "true" ]; then
              PKG_NAME=$(jq -r '.name' "$pkg")
              echo "Updating $PKG_NAME → $RELEASE_VERSION"
              jq --arg v "$RELEASE_VERSION" '
                .version = $v
                | (if .exports then .exports |= with_entries(if (.value | type) == "object" then .value |= del(.source) else . end) else . end)
                | (if .dependencies then
                    .dependencies |= with_entries(
                      if (.key | startswith("@cocoar/")) and (.value | startswith("workspace:"))
                      then .value = $v else . end)
                  else . end)
                | (if .peerDependencies then
                    .peerDependencies |= with_entries(
                      if (.key | startswith("@cocoar/")) and (.value | startswith("workspace:"))
                      then .value = $v else . end)
                  else . end)
              ' "$pkg" > tmp.json && mv tmp.json "$pkg"
            fi
          done

      - name: Pack npm packages
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          for pkg_dir in packages/*/; do
            if [ -f "$pkg_dir/package.json" ] && [ "$(jq -r '.private // false' "$pkg_dir/package.json")" != "true" ]; then
              PKG_NAME=$(jq -r '.name' "$pkg_dir/package.json")
              echo "Packing $PKG_NAME"
              (cd "$pkg_dir" && pnpm pack --pack-destination ../../artifacts)
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ steps.version.outputs.RELEASE_VERSION }}
          path: artifacts
          retention-days: 90

      - name: Setup npm registry
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - name: Publish to npmjs.com
        run: |
          shopt -s nullglob
          for pkg_dir in packages/*/; do
            if [ -f "$pkg_dir/package.json" ] && [ "$(jq -r '.private // false' "$pkg_dir/package.json")" != "true" ]; then
              PKG_NAME=$(jq -r '.name' "$pkg_dir/package.json")
              echo "Publishing $PKG_NAME@$RELEASE_VERSION"
              (cd "$pkg_dir" && npm publish --access public)
            fi
          done

  deploy-docs:
    name: Deploy Documentation
    needs: build-and-publish-stable
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build VitePress docs
        run: pnpm --filter @cocoar/docs build

      - name: Extract docs version
        id: docs-version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "value=v${MAJOR}.${MINOR}" >> $GITHUB_OUTPUT

      - name: Package
        run: cd apps/docs/.vitepress/dist && zip -r $GITHUB_WORKSPACE/docs.zip .

      - name: Upload to Shelf
        env:
          KEY: ${{ secrets.SHELF_API_KEY }}
          URL: ${{ secrets.SHELF_BASE_URL }}
          VER: ${{ steps.docs-version.outputs.value }}
        run: |
          echo "Deploying cocoar-ui-vue docs $VER"
          curl -f -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/zip" \
            --data-binary @$GITHUB_WORKSPACE/docs.zip \
            "${URL}/_api/products/cocoar-ui-vue/versions/${VER}"

      - name: Deployment summary
        run: |
          echo "### Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Product:** cocoar-ui-vue" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.docs-version.outputs.value }}" >> $GITHUB_STEP_SUMMARY
