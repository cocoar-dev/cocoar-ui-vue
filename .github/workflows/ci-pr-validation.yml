name: CI - Pull Request

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      # Root-level docs (README, CHANGELOG, etc.) — no code impact.
      - '*.md'
      # VitePress site — built by `cd-deploy-docs.yml` (manual), not by CI.
      - 'apps/docs/**'

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Volta (Node + pnpm)
        uses: volta-cli/action@v5
        with:
          package-json-path: ./package.json

      - name: Install Node.js
        run: volta install node@22.17.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v4

      - name: Log calculated version
        run: echo "GitVersion calculated version ${{ steps.gv.outputs.semVer }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @cocoar/playground exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
