name: ci

# One workflow for everything, as in CodeAlta:
#
#   pull request          → build & test, visual baselines (the title is judged and corrected by the agent that
#                           merges: skill cocoar-pr, pr.mjs merge)
#   push to develop, …    → build & test, visual baselines (the green run the release skill requires before a tag)
#   workflow_dispatch     → build & test, then a prerelease: develop → X.Y.Z-beta.N on npm (dist-tag beta),
#                           any other branch → X.Y.Z-alpha.N as @cocoar-dev/* on GitHub Packages
#   tag vX.Y.Z            → build & test, publish (latest), deploy the docs, and as the very last step the
#                           GitHub release with notes generated by dotnet-releaser
#
# Versions come from git tags only (scripts/release/version.mjs). Packages and docs leave only from
# cocoar-dev/cocoar-ui-vue: anywhere else every publish is a dry run (scripts/release/lib.mjs).
# Releases and betas are started with the release skill (.alta/skills/cocoar-release).
#
# Rehearsal: with the repository variable SIMULATE_BUILD=true (set only in a sandbox), lint, typecheck,
# tests, the visual comparison, the build and the docs build are skipped, so the whole flow costs a minute per run. The real
# repository never sets it.

on:
  push:
    branches: [develop, 'release/**', 'support/**']
    tags: ['v*.*.*']
  pull_request:
    branches: [develop, 'release/**', 'support/**']
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces the checks of a pull request; anything that may publish is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  RELEASE: ${{ github.ref_type == 'tag' }}
  PRERELEASE: ${{ github.event_name == 'workflow_dispatch' }}
  SIMULATE: ${{ vars.SIMULATE_BUILD == 'true' && github.repository != 'cocoar-dev/cocoar-ui-vue' }}

jobs:
  build:
    name: Build, test & pack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Volta (Node + pnpm)
        uses: volta-cli/action@v5
        with:
          package-json-path: ./package.json

      - name: Install Node.js
        run: volta install node@22.17.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Version
        id: version
        run: |
          if [ "$RELEASE" = "true" ]; then
            # The tagged commit must be on develop, a release/* or a support/* branch.
            git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
            if ! git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)' | grep -qE '^origin/(develop|release/.+|support/.+)$'; then
              echo "::error ::$GITHUB_REF_NAME is not on develop, release/* or support/*"; exit 1
            fi
            CHANNEL=stable
          elif [ "$PRERELEASE" = "true" ]; then
            if [ "$GITHUB_REF_NAME" = "develop" ]; then CHANNEL=beta; else CHANNEL=alpha; fi
          else
            CHANNEL=ci
          fi
          VERSION=$(node scripts/release/version.mjs --channel "$CHANNEL")
          echo "### $VERSION ($CHANNEL) — $GITHUB_REF_NAME @ ${GITHUB_SHA::8}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: env.SIMULATE != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: env.SIMULATE != 'true'
        run: pnpm --filter @cocoar/playground exec playwright install --with-deps chromium

      - name: Lint
        if: env.SIMULATE != 'true'
        run: pnpm lint

      - name: Typecheck
        if: env.SIMULATE != 'true'
        run: pnpm typecheck

      - name: Test
        if: env.SIMULATE != 'true'
        run: pnpm test

      - name: Build packages
        if: env.SIMULATE != 'true'
        run: pnpm build

      - name: Agent Skill matches the docs
        run: node apps/docs/scripts/sync-skill.mjs --check

      - name: Stamp the version
        run: node scripts/release/stamp.mjs "${{ steps.version.outputs.version }}" --channel "${{ steps.version.outputs.channel == 'alpha' && 'alpha' || 'stable' }}"

      - name: Pack
        run: node scripts/release/pack.mjs --out artifacts

      - name: Verify packed PageBuilder in Vite consumer
        if: env.SIMULATE != 'true' && steps.version.outputs.channel != 'alpha'
        run: pnpm --filter @cocoar/playground test:packed-page-builder-consumer

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts
          retention-days: ${{ env.RELEASE == 'true' && 90 || 7 }}

      - name: Build the docs
        if: env.RELEASE == 'true' && env.SIMULATE != 'true'
        run: pnpm --filter @cocoar/docs build

      - name: Simulated build
        if: env.SIMULATE == 'true'
        run: |
          echo "::notice ::SIMULATE_BUILD — lint, typecheck, tests, build and docs build skipped"
          mkdir -p apps/docs/.vitepress/dist && echo "<h1>simulated docs</h1>" > apps/docs/.vitepress/dist/index.html

      - name: Upload the docs
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-${{ steps.version.outputs.version }}
          path: apps/docs/.vitepress/dist
          retention-days: 7

  # Visual baselines (apps/playground/visual/README.md), for pull requests and branch pushes. Not for tags or
  # workflow_dispatch: those build a commit whose comparison already ran on its branch. The image is read from the
  # lockfile (the version of @playwright/test), so it is named only there.
  visual-image:
    name: Visual image
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            pnpm-lock.yaml
            apps/playground
      - id: image
        run: echo "image=$(node apps/playground/scripts/visual.mjs --print-image)" >> "$GITHUB_OUTPUT"

  visual:
    name: Visual
    needs: visual-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ${{ needs.visual-image.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6

      # The same command as `node apps/playground/scripts/visual.mjs` runs inside Docker locally.
      - name: Compare with the baselines
        if: env.SIMULATE != 'true'
        run: node apps/playground/scripts/visual.mjs --inside

      - name: Simulated comparison
        if: env.SIMULATE == 'true'
        run: echo "::notice ::SIMULATE_BUILD — visual comparison skipped"

      - name: Upload the report (expected / actual / diff)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: apps/playground/visual-results
          retention-days: 14

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Select the registry
        id: registry
        run: |
          case "${{ needs.build.outputs.channel }}" in
            stable) echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "url=https://registry.npmjs.org" >> "$GITHUB_OUTPUT" ;;
            beta)   echo "tag=beta"   >> "$GITHUB_OUTPUT"; echo "url=https://registry.npmjs.org" >> "$GITHUB_OUTPUT" ;;
            alpha)  echo "tag=alpha"  >> "$GITHUB_OUTPUT"; echo "url=https://npm.pkg.github.com" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error ::nothing to publish for channel ${{ needs.build.outputs.channel }}"; exit 1 ;;
          esac

      - name: Setup the registry credentials
        if: github.repository == 'cocoar-dev/cocoar-ui-vue'
        env:
          NPMJS_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.registry.outputs.tag }}" = "alpha" ]; then
            echo "@cocoar-dev:registry=https://npm.pkg.github.com" >> ~/.npmrc
            echo "//npm.pkg.github.com/:_authToken=$GITHUB_PACKAGES_TOKEN" >> ~/.npmrc
          else
            echo "//registry.npmjs.org/:_authToken=$NPMJS_TOKEN" >> ~/.npmrc
          fi

      - name: Publish
        env:
          RELEASE_LIVE: 'true'
        run: node scripts/release/publish.mjs --tag "${{ steps.registry.outputs.tag }}" --registry "${{ steps.registry.outputs.url }}" --dir artifacts

  docs:
    name: Deploy the docs
    needs: [build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download the docs
        uses: actions/download-artifact@v8
        with:
          name: docs-${{ needs.build.outputs.version }}
          path: dist

      - name: Package
        id: package
        run: |
          cd dist && zip -qr "$GITHUB_WORKSPACE/docs.zip" .
          V="${{ needs.build.outputs.version }}"; echo "docs=v${V%.*}" >> "$GITHUB_OUTPUT"

      - name: Upload to Shelf
        if: github.repository == 'cocoar-dev/cocoar-ui-vue'
        env:
          KEY: ${{ secrets.SHELF_API_KEY }}
          URL: ${{ secrets.SHELF_BASE_URL }}
          VER: ${{ steps.package.outputs.docs }}
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/zip" \
            --data-binary @"$GITHUB_WORKSPACE/docs.zip" \
            "${URL}/_api/products/cocoar-ui-vue/versions/${VER}"

      - name: Upload skipped outside cocoar-dev/cocoar-ui-vue
        if: github.repository != 'cocoar-dev/cocoar-ui-vue'
        run: echo "DRY RUN — would upload $(du -h docs.zip | cut -f1) of docs as ${{ steps.package.outputs.docs }}"

  github-release:
    name: GitHub release
    needs: [build, docs]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # dotnet-releaser reads the pull requests of the commits for the notes.
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-releaser
        run: dotnet tool install -g dotnet-releaser

      - name: Create the release with generated notes (last step)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/notes.mjs "${{ needs.build.outputs.version }}" --update
