name: CD - Prerelease

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-prerelease:
    name: Lint, Test, Build & Publish Prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TURBO_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Volta (Node + pnpm)
        uses: volta-cli/action@v5
        with:
          package-json-path: ./package.json

      - name: Install Node.js
        run: volta install node@22.17.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v4

      - name: Select npm prerelease channel
        run: |
          case "${{ github.ref_name }}" in
            develop)
              DIST_TAG="beta"
              REGISTRY="https://registry.npmjs.org"
              ;;
            release/*)
              DIST_TAG="rc"
              REGISTRY="https://registry.npmjs.org"
              ;;
            *)
              DIST_TAG="alpha"
              REGISTRY="https://npm.pkg.github.com"
              ;;
          esac

          echo "NPM_DIST_TAG=$DIST_TAG" >> $GITHUB_ENV
          echo "PUBLISH_REGISTRY=$REGISTRY" >> $GITHUB_ENV
          echo "Selected npm dist-tag: $DIST_TAG"
          echo "Selected package registry: $REGISTRY"

      - name: Build prerelease version string
        id: prerelease
        run: |
          BASE="${{ steps.gv.outputs.majorMinorPatch }}-$NPM_DIST_TAG"
          N="${{ steps.gv.outputs.commitsSinceVersionSource }}"
          VERSION="$BASE.$N"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated prerelease version: $VERSION"

      - name: Log calculated version
        run: |
          echo "GitVersion SemVer (original): ${{ steps.gv.outputs.semVer }}"
          echo "Using PACKAGE_VERSION:        $PACKAGE_VERSION"
          echo "Using npm dist-tag:           $NPM_DIST_TAG"
          echo "Using package registry:       $PUBLISH_REGISTRY"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @cocoar/playground exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Stamp package versions
        run: |
          echo "Setting package versions to: $PACKAGE_VERSION"

          shopt -s nullglob
          for pkg in packages/*/package.json; do
            if [ -f "$pkg" ] && [ "$(jq -r '.private // false' "$pkg")" != "true" ]; then
              PKG_NAME=$(jq -r '.name' "$pkg")
              echo "Updating $PKG_NAME → $PACKAGE_VERSION"
              jq --arg v "$PACKAGE_VERSION" --arg channel "$NPM_DIST_TAG" '
                .version = $v
                | (if $channel == "alpha" then
                    .name |= sub("^@cocoar/"; "@cocoar-dev/")
                  else . end)
                | (if .exports then .exports |= with_entries(if (.value | type) == "object" then .value |= del(.source) else . end) else . end)
                | (if .dependencies then
                    .dependencies |= with_entries(
                      if (.key | startswith("@cocoar/")) and (.value | startswith("workspace:"))
                      then
                        if $channel == "alpha"
                        then . as $entry | .value = ("npm:" + ($entry.key | sub("^@cocoar/"; "@cocoar-dev/")) + "@" + $v)
                        else .value = $v
                        end
                      else . end)
                  else . end)
                | (if .optionalDependencies then
                    .optionalDependencies |= with_entries(
                      if (.key | startswith("@cocoar/")) and (.value | startswith("workspace:"))
                      then
                        if $channel == "alpha"
                        then . as $entry | .value = ("npm:" + ($entry.key | sub("^@cocoar/"; "@cocoar-dev/")) + "@" + $v)
                        else .value = $v
                        end
                      else . end)
                  else . end)
                | (if .peerDependencies then
                    .peerDependencies |= with_entries(
                      if (.key | startswith("@cocoar/")) and (.value | startswith("workspace:"))
                      then .value = $v else . end)
                  else . end)
              ' "$pkg" > tmp.json && mv tmp.json "$pkg"
            fi
          done

      - name: Pack npm packages
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          for pkg_dir in packages/*/; do
            if [ -f "$pkg_dir/package.json" ] && [ "$(jq -r '.private // false' "$pkg_dir/package.json")" != "true" ]; then
              PKG_NAME=$(jq -r '.name' "$pkg_dir/package.json")
              echo "Packing $PKG_NAME"
              (cd "$pkg_dir" && pnpm pack --pack-destination ../../artifacts)
            fi
          done

      - name: Verify packed PageBuilder in Vite consumer
        run: pnpm --filter @cocoar/playground test:packed-page-builder-consumer

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-packages-${{ steps.prerelease.outputs.PACKAGE_VERSION }}
          path: artifacts
          retention-days: 30

      - name: Setup package registry
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$NPM_DIST_TAG" = "alpha" ]; then
            echo "@cocoar-dev:registry=https://npm.pkg.github.com" >> ~/.npmrc
            echo "//npm.pkg.github.com/:_authToken=$GITHUB_PACKAGES_TOKEN" >> ~/.npmrc
          else
            echo "//registry.npmjs.org/:_authToken=$NPMJS_TOKEN" >> ~/.npmrc
          fi

      - name: Publish packages
        run: |
          shopt -s nullglob
          for pkg_dir in packages/*/; do
            if [ -f "$pkg_dir/package.json" ] && [ "$(jq -r '.private // false' "$pkg_dir/package.json")" != "true" ]; then
              PKG_NAME=$(jq -r '.name' "$pkg_dir/package.json")
              PKG_VERSION=$(jq -r '.version' "$pkg_dir/package.json")
              echo "Publishing $PKG_NAME@$PKG_VERSION to '$PUBLISH_REGISTRY' with tag '$NPM_DIST_TAG'"
              if [ "$NPM_DIST_TAG" = "alpha" ]; then
                (cd "$pkg_dir" && npm publish --registry "$PUBLISH_REGISTRY" --tag "$NPM_DIST_TAG")
              else
                (cd "$pkg_dir" && npm publish --registry "$PUBLISH_REGISTRY" --tag "$NPM_DIST_TAG" --access public)
              fi
            fi
          done
