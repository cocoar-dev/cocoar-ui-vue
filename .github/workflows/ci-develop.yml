name: CI - Build & Test

on:
  push:
    branches: [develop]
    paths-ignore:
      # Root-level docs (README, CHANGELOG, etc.) — no code impact.
      - '*.md'
      # VitePress site — built by `cd-deploy-docs.yml` (manual), not by CI.
      - 'apps/docs/**'

jobs:
  build-and-pack-alpha:
    name: Lint, Test, Build & Pack Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Volta (Node + pnpm)
        uses: volta-cli/action@v4
        with:
          package-json-path: ./package.json

      - name: Install Node.js
        run: volta install node

      - name: Install pnpm
        run: volta install pnpm

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v3

      - name: Log calculated version
        run: echo "GitVersion calculated version ${{ steps.gv.outputs.SemVer }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Caching disabled — multiple attempts showed Playwright's
      # `extract-zip` hangs silently for 5+ min after the 1-second download
      # completes, regardless of cache hit/miss/OS. Workaround below uses
      # the system `unzip` (a few seconds for 170 MiB) instead of
      # Playwright's internal extract, then writes the marker file so
      # `playwright install` detects "already installed" and skips its own
      # extract. URL + revision are pinned to Playwright 1.59.1 — bump both
      # when the package upgrades.
      - name: Install Playwright browsers (system-unzip workaround)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          BROWSERS_DIR="$HOME/.cache/ms-playwright/chromium-1217"
          URL="https://cdn.playwright.dev/builds/cft/147.0.7727.15/linux64/chrome-linux64.zip"
          mkdir -p "$BROWSERS_DIR"
          echo "Downloading $URL"
          curl -fsSL --retry 3 "$URL" -o /tmp/chromium.zip
          echo "Extracting via system unzip"
          unzip -q /tmp/chromium.zip -d "$BROWSERS_DIR"
          rm /tmp/chromium.zip
          # Marker tells `playwright install` the browser is ready; without
          # it, Playwright re-triggers its own extract (which is what hangs).
          touch "$BROWSERS_DIR/INSTALLATION_COMPLETE"
          "$BROWSERS_DIR/chrome-linux64/chrome" --version
          # Run playwright install for any auxiliary setup (creates symlinks,
          # registers the install). With INSTALLATION_COMPLETE present, this
          # should be a no-op skip and not re-extract.
          pnpm --filter @cocoar/playground exec playwright install chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Stamp package versions
        run: |
          VERSION="${{ steps.gv.outputs.SemVer }}"
          echo "Setting package versions to: $VERSION"

          shopt -s nullglob
          for pkg in packages/*/package.json; do
            if [ -f "$pkg" ] && [ "$(jq -r '.private // false' "$pkg")" != "true" ]; then
              PKG_NAME=$(jq -r '.name' "$pkg")
              echo "Updating $PKG_NAME → $VERSION"
              jq --arg v "$VERSION" '
                .version = $v
                | (if .exports then .exports |= with_entries(if (.value | type) == "object" then .value |= del(.source) else . end) else . end)
                | (if .dependencies then
                    .dependencies |= with_entries(
                      if (.key | startswith("@cocoar/")) and (.value | startswith("workspace:"))
                      then .value = $v else . end)
                  else . end)
                | (if .peerDependencies then
                    .peerDependencies |= with_entries(
                      if (.key | startswith("@cocoar/")) and (.value | startswith("workspace:"))
                      then .value = $v else . end)
                  else . end)
              ' "$pkg" > tmp.json && mv tmp.json "$pkg"
            fi
          done

      - name: Pack npm packages
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          for pkg_dir in packages/*/; do
            if [ -f "$pkg_dir/package.json" ] && [ "$(jq -r '.private // false' "$pkg_dir/package.json")" != "true" ]; then
              PKG_NAME=$(jq -r '.name' "$pkg_dir/package.json")
              echo "Packing $PKG_NAME"
              (cd "$pkg_dir" && pnpm pack --pack-destination ../../artifacts)
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-${{ steps.gv.outputs.SemVer }}
          path: artifacts
          retention-days: 7
